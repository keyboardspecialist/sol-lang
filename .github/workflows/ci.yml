name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSOL_ENABLE_WERROR=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --timeout 120
      - run: python3 tests/stress/run_stress.py --sol build/sol --baseline tests/stress/baselines.json --work-dir build/stress

  sanitize:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: CC=clang cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DSOL_ENABLE_WERROR=ON -DSOL_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --timeout 180 -j 1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: CC=clang cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF -DSOL_ENABLE_WERROR=ON -DSOL_BUILD_FUZZERS=ON
      - run: cmake --build build --parallel 2 --target sol_parser_fuzzer sol_package_fuzzer sol_ir_fuzzer
      - run: build/fuzz/sol_parser_fuzzer fuzz/corpus/parser -dict=fuzz/sol.dict -seed=1 -runs=1000 -max_len=262144 -timeout=5
      - run: build/fuzz/sol_package_fuzzer fuzz/corpus/package -seed=1 -runs=500 -max_len=262144 -timeout=10
      - run: build/fuzz/sol_ir_fuzzer fuzz/corpus/ir -seed=1 -runs=500 -max_len=4096 -timeout=10
